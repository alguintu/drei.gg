<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>desk · drei.gg</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=JetBrains+Mono:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #e8eaee; --panel: #f5f6f8; --ink: #15171d; --mute: #5b6070; --line: #c9ccd5;
    --team: #2b3cf0; --ribbon: #c8221a; --marker: #ffd23f; --aeris: #2bb3ad;
    --display: "Anybody", "Arial Narrow", Impact, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f1117; --panel: #171a23; --ink: #e7e9ef; --mute: #9298a8; --line: #2a2e3b; --team: #8a94ff; --ribbon: #ff4d3d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); display: grid; grid-template-columns: 230px minmax(380px, 1fr) var(--pv, 1fr); grid-template-rows: 48px 1fr; }
  body.pv-off { --pv: 0px; }
  body.pv-off .preview { display: none; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); font: 600 13px/1 var(--mono); }
  header .brand { font: 900 22px/1 var(--display); font-stretch: 125%; letter-spacing: -.02em; }
  header .brand b { color: var(--ribbon); }
  .sp { flex: 1; }
  header .state { color: var(--mute); }
  header .state.dirty { color: var(--ink); }
  header .state.err { color: var(--ribbon); }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; font: 600 12px/1 var(--mono); }
  button:hover { border-color: var(--ink); }
  button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.go { background: var(--marker); color: #15171d; border-color: #15171d; }
  .seg { display: inline-flex; }
  .seg button + button { border-left: 0; }

  aside { border-right: 1px solid var(--line); overflow: auto; padding: 12px; }
  aside .new { width: 100%; margin-bottom: 12px; }
  aside a { display: block; padding: 8px; border-left: 3px solid transparent; color: inherit; text-decoration: none; cursor: pointer; }
  aside a:hover { background: var(--panel); }
  aside a.cur { border-left-color: var(--marker); background: var(--panel); }
  aside a .t { font: 700 14px/1.2 var(--display); }
  aside a .m { font: 12px/1.6 var(--mono); color: var(--mute); }
  aside a .d { color: var(--ribbon); }

  main { overflow: auto; padding: 18px 22px 40px; }
  main.empty { display: grid; place-items: center; color: var(--mute); font-family: var(--mono); }
  .title { width: 100%; border: 0; background: none; font: 800 30px/1.1 var(--display); padding: 4px 0; outline: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: end; }
  label { display: grid; gap: 4px; font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  label.grow { flex: 1; min-width: 160px; }
  label.chk { display: flex; align-items: center; gap: 6px; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); padding: 7px 8px; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); font-family: var(--body); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--marker); outline-offset: -1px; }
  fieldset { border: 1px solid var(--line); padding: 12px 14px 4px; margin: 16px 0; }
  legend { font: 700 12px/1 var(--mono); padding: 0 6px; text-transform: uppercase; letter-spacing: .08em; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .thumbs img { width: 76px; height: 50px; object-fit: cover; border: 2px solid transparent; cursor: pointer; background: var(--line); }
  .thumbs img.cur { border-color: var(--marker); }
  .thumbs .none { width: 76px; height: 50px; display: grid; place-items: center; border: 2px dashed var(--line); font: 600 11px/1 var(--mono); color: var(--mute); cursor: pointer; }
  .thumbs .none.cur { border-color: var(--marker); }
  .hint { font: 12px/1.5 var(--mono); color: var(--mute); margin: 0 0 10px; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0 6px; }
  textarea.body { width: 100%; min-height: 55vh; font: 14px/1.6 var(--mono); resize: vertical; tab-size: 2; }
  textarea.body.drop { outline: 2px dashed var(--marker); }

  aside a.home { border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .lrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; }
  .lrow input.wide { min-width: 12ch; }
  .lrow input, .lrow select { min-width: 0; }
  .lrow input.wide { flex: 1; }
  .lrow button { padding: 6px 8px; }
  .add { margin: 2px 0 10px; }
  button:disabled { opacity: .45; cursor: default; }
  .preview { border-left: 1px solid var(--line); display: grid; grid-template-rows: 38px 1fr; min-width: 0; }
  .preview .bar { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); font: 12px/1 var(--mono); color: var(--mute); }
  .preview .bar .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview .stage { overflow: auto; display: grid; justify-items: center; background: var(--panel); }
  .preview iframe { grid-area: 1 / 1; border: 0; width: 100%; height: 100%; background: #fff; }
  .preview iframe.next { visibility: hidden; }
  .preview.phone iframe { width: 390px; border-inline: 1px solid var(--line); }

  dialog { border: 1px solid var(--ink); background: var(--paper); color: var(--ink); max-width: 560px; width: 90vw; }
  dialog pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--panel); padding: 10px; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<header>
  <span class="brand">desk<b>.</b></span>
  <span class="state" id="state">loading</span>
  <span class="sp"></span>
  <span class="seg" title="Preview">
    <button data-pv="split" class="on">split</button><button data-pv="popup">popup</button><button data-pv="off">off</button>
  </span>
  <button id="catalog" title="Every cover for this post, and every block, in the preview">catalog</button>
  <button id="publish" class="go">publish</button>
</header>

<aside>
  <button class="new" id="new">+ new post</button>
  <nav id="list"></nav>
</aside>

<main id="main" class="empty">pick a post or start a new one</main>

<section class="preview" id="preview">
  <div class="bar">
    <span class="url" id="pvurl"></span>
    <span class="seg"><button data-w="desk" class="on">desktop</button><button data-w="phone">phone</button></span>
    <button id="reload" title="Reload preview">↻</button>
  </div>
  <div class="stage"><iframe id="frame" title="Preview"></iframe></div>
</section>

<dialog id="dlg"><form method="dialog"><h3 id="dlgT"></h3><div id="dlgB"></div><p class="row"><span class="sp"></span><button value="cancel">cancel</button><button value="ok" class="go" id="dlgOk">ok</button></p></form></dialog>

<template id="form">
  <input class="title" name="title" placeholder="Title" />
  <div class="row">
    <label>date<input type="date" name="date" /></label>
    <label>tag<select name="tag"></select></label>
    <label>label<input name="label" placeholder="v0.0.2" size="10" /></label>
    <label class="grow">summary<input name="summary" placeholder="One line for RSS and link previews" /></label>
    <label class="chk"><input type="checkbox" name="draft" /> draft</label>
  </div>

  <fieldset>
    <legend>Cover</legend>
    <div class="thumbs" id="thumbs"></div>
    <div class="row">
      <label class="grow">image alt<input name="image_alt" placeholder="What the image shows" /></label>
      <button type="button" id="upload">upload image…</button>
      <input type="file" id="file" accept="image/*" hidden />
    </div>
    <div class="row">
      <label>layout<select name="layout"></select></label>
      <button type="button" id="shuffle" title="Random layout">shuffle</button>
      <label>palette<select name="palette"></select></label>
    </div>
    <p class="hint" id="pickHint"></p>
    <div class="row slots" id="slots"></div>
    <p class="hint">Cover text: blank uses the layout's default, and title and summary default to the post's own. Tokens: {date} {dd} {mm} {label} {title} {summary} {tag} {kicker} {script} {initial}.</p>
  </fieldset>

  <div class="tools" id="tools"></div>
  <textarea class="body" name="body" spellcheck="true"></textarea>
  <p class="hint">Drop an image on the text to upload it and insert it with a frame. Frames: offset, teal, bracket, rounded, quarter, tape.</p>
</template>

<template id="homeForm">
  <p class="title">Home page</p>
  <div class="row">
    <label class="grow">thesis<input name="thesis" /></label>
    <label>domain bought<input type="date" name="domainBought" /></label>
  </div>
  <p class="hint">The line under the big drei.gg. ==text== is highlighted and *text* is italic, here and in the definitions.</p>
  <fieldset><legend>.gg definitions</legend><div data-list="gloss"></div></fieldset>
  <fieldset><legend>Killfeed</legend><div data-list="killfeed"></div></fieldset>
  <fieldset><legend>Inventory</legend><div data-list="inventory"></div></fieldset>
  <fieldset><legend>House rules</legend><div data-list="rules"></div></fieldset>
</template>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const api = async (path, opts = {}) => {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const store = {
  get: (k, d) => { try { return localStorage.getItem('desk.' + k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('desk.' + k, v); } catch {} },
};

// cur is the open post; home is the home page's content while that's open instead.
let META, cur = null, home = null, catalog = false, timer = null, popup = null;
const state = (text, cls = '') => { const s = $('#state'); s.textContent = text; s.className = 'state ' + cls; };

// Toolbar snippets: the blocks from src/lib/blocks.ts, one image frame, and a link.
// The catalog shows every frame.
const snippets = () => Object.fromEntries(META.blocks
  .filter((b) => b.group !== 'frame' || b.name === 'offset')
  .map((b) => [b.group === 'frame' ? 'image' : b.name, b.md]));

async function boot() {
  META = await api('/api/meta');
  await loadList();
  setCatalog(false);
  setPreviewMode(store.get('pv', 'split'));
  setWidth(store.get('w', 'desk'));
  const last = store.get('post');
  if (last === ':home') openHome().catch(() => {});
  else if (last) open(last).catch(() => {});
  state('ready');
}

async function loadList() {
  const posts = await api('/api/posts');
  $('#list').innerHTML = `<a data-id=":home" class="home ${home ? 'cur' : ''}"><div class="t">Home page</div><div class="m">thesis, killfeed, inventory, rules</div></a>` + posts.map((p) => `<a data-id="${p.id}" class="${cur?.id === p.id ? 'cur' : ''}"><div class="t">${esc(p.title)}</div><div class="m">${p.date} · ${p.tag}${p.draft ? ' · <span class="d">draft</span>' : ''}</div></a>`).join('');
}
$('#list').addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (a) (a.dataset.id === ':home' ? openHome() : open(a.dataset.id));
});

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
const opt = (v, label = v, sel) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${label}</option>`;

// A new #main for each post or the home page, so the last one's listeners go with it.
function freshMain() {
  const main = $('#main').cloneNode(false);
  main.className = '';
  $('#main').replaceWith(main);
  return main;
}

async function open(id) {
  if (timer) await save();
  cur = await api('/api/post?id=' + encodeURIComponent(id));
  home = null;
  store.set('post', id);
  const main = freshMain();
  main.replaceChildren($('#form').content.cloneNode(true));
  const d = cur.data;
  const f = (n) => main.querySelector(`[name="${n}"]`);
  f('title').value = d.title ?? '';
  f('date').value = String(d.date ?? '').slice(0, 10);
  f('tag').innerHTML = META.tags.map((t) => opt(t, t, d.tag)).join('');
  f('label').value = d.label ?? '';
  f('summary').value = d.summary ?? '';
  f('draft').checked = d.draft === true;
  f('image_alt').value = d.image_alt ?? '';
  f('palette').innerHTML = opt('', 'auto', d.palette ?? '') + META.palettes.map((p) => opt(p, p, d.palette)).join('');
  d.cover = { ...(d.cover ?? {}) };
  f('body').value = cur.body;
  renderLayouts();
  renderThumbs();
  $('#tools').innerHTML = Object.keys(snippets()).map((k) => `<button type="button" data-snip="${k}">${k}</button>`).join('');
  main.addEventListener('input', (e) => {
    if (e.target.dataset.slot) cur.data.cover[e.target.dataset.slot] = e.target.value;
    changed();
  });
  main.addEventListener('change', (e) => {
    if (e.target.name === 'layout') renderLayouts();
    changed();
  });
  wireMain(main);
  setCatalog(catalog);
  await loadList();
  showPreview();
}

// ---- Home page ----
// Each list in home.json: its fields, as [key, input width] or [key, choices].
const LISTS = {
  gloss: { fields: [['tag', 7], ['text', 0]], blank: { tag: '', text: '' } },
  killfeed: { fields: [['who', 9], ['verb', 9], ['what', 0], ['style', ['good', 'bad']]], blank: { who: '', verb: '', what: '', style: 'good' } },
  inventory: { fields: [['name', 10], ['note', 0], ['status', ['live', 'empty']], ['href', 8]], blank: { name: 'empty slot', note: '', status: 'empty' } },
  rules: { fields: [['rule', 0]], blank: '' },
};

async function openHome() {
  if (timer) await save();
  home = await api('/api/home');
  cur = null;
  store.set('post', ':home');
  const main = freshMain();
  main.replaceChildren($('#homeForm').content.cloneNode(true));
  main.querySelector('[name="thesis"]').value = home.thesis ?? '';
  main.querySelector('[name="domainBought"]').value = home.domainBought ?? '';
  for (const name of Object.keys(LISTS)) renderList(name);
  main.addEventListener('input', homeEdit);
  main.addEventListener('change', homeEdit);
  main.addEventListener('click', homeClick);
  setCatalog(false);
  await loadList();
  showPreview();
}

function renderList(name) {
  const { fields } = LISTS[name];
  const plain = typeof LISTS[name].blank === 'string';
  const box = $(`[data-list="${name}"]`);
  box.innerHTML = home[name].map((item, i) => `<div class="lrow">${fields.map(([k, w]) => {
    const v = plain ? item : item[k] ?? '';
    const at = `data-list="${name}" data-i="${i}" data-k="${k}" title="${k}"`;
    return Array.isArray(w)
      ? `<select ${at}>${w.map((c) => opt(c, c, v)).join('')}</select>`
      : `<input ${at} value="${esc(v)}" placeholder="${k}" ${w ? `size="${w}"` : 'class="wide"'} />`;
  }).join('')}<button type="button" data-move="${name}:${i}" title="Move up" ${i ? '' : 'disabled'}>↑</button><button type="button" data-drop="${name}:${i}" title="Remove">×</button></div>`).join('')
    + `<button type="button" class="add" data-add="${name}">+ add</button>`;
}

function homeEdit(e) {
  const t = e.target;
  if (t.name === 'thesis' || t.name === 'domainBought') home[t.name] = t.value;
  else if (t.dataset.list) {
    const list = home[t.dataset.list], i = Number(t.dataset.i);
    if (typeof LISTS[t.dataset.list].blank === 'string') list[i] = t.value;
    else list[i][t.dataset.k] = t.value;
  } else return;
  changed();
}

function homeClick(e) {
  const b = e.target.closest('button');
  if (!b) return;
  const [name, i] = (b.dataset.move || b.dataset.drop || '').split(':');
  const list = home[name || b.dataset.add];
  if (!list) return;
  if (b.dataset.add) list.push(structuredClone(LISTS[b.dataset.add].blank));
  else if (b.dataset.move) list.splice(i - 1, 0, ...list.splice(i, 1));
  else list.splice(i, 1);
  renderList(name || b.dataset.add);
  changed();
}

// What gets written: empty optional links dropped, blank rows kept so a fresh row can be filled in.
function homeData() {
  return { ...home, inventory: home.inventory.map(({ href, ...item }) => (href ? { ...item, href } : item)) };
}

function renderLayouts() {
  const sel = $('[name="layout"]');
  // Keep what is on screen; a save that lands mid-edit must not reset the picker.
  const v = sel.options.length ? sel.value : (cur.data.layout ?? '');
  const hasImg = !!cur.data.image;
  // Type layouts take an image too; image layouts without one show a hatched slot.
  sel.innerHTML = opt('', 'auto', v)
    + `<optgroup label="image layouts${hasImg ? '' : ' (need an image)'}">${META.image.map((l) => opt(l, l, v)).join('')}</optgroup>`
    + `<optgroup label="type layouts">${META.type.map((l) => opt(l, l, v)).join('')}</optgroup>`;
  const auto = hasImg ? cur.auto.image : cur.auto.none;
  $('#pickHint').textContent = v ? '' : hasImg
    ? `auto: the filename picks from all ${META.image.length + META.type.length} layouts (${auto}).`
    : `auto: no image, so the filename picks from the ${META.type.length} type layouts (${auto}).`;
  renderSlots(v || auto);
}

// One input per text slot on the chosen layout. Values for slots the layout
// doesn't have stay in the post, so switching layouts back and forth loses nothing.
function renderSlots(layout) {
  const box = $('#slots');
  if (box.dataset.layout === layout) return;
  box.dataset.layout = layout;
  const slots = META.slots[layout] ?? {};
  // The title and summary slots default to the post's own, so show those.
  const own = (def) => def.replace('{title}', cur.data.title ?? '').replace('{summary}', cur.data.summary || cur.data.title || '');
  box.innerHTML = Object.entries(slots).map(([k, d]) => [k, own(d)]).map(([k, def]) =>
    `<label${k === 'title' || k === 'summary' ? ' class="grow"' : ''}>${esc(k)}<input data-slot="${esc(k)}" value="${esc(cur.data.cover[k] ?? '')}" placeholder="${esc(def)}" size="${Math.min(28, Math.max(8, def.length))}" /></label>`).join('')
    || '<p class="hint">This layout only shows the title and summary.</p>';
}

function renderThumbs() {
  const img = cur.data.image?.replace(/^\.\//, '');
  $('#thumbs').innerHTML = `<span class="none ${img ? '' : 'cur'}" data-img="">no image</span>`
    + cur.images.map((n) => `<img src="/img/${cur.id}/${encodeURIComponent(n)}" data-img="${esc(n)}" title="${esc(n)}" class="${n === img ? 'cur' : ''}" />`).join('');
}

function wireMain(main) {
  $('#thumbs').addEventListener('click', (e) => {
    const t = e.target.closest('[data-img]');
    if (!t) return;
    cur.data.image = t.dataset.img ? './' + t.dataset.img : '';
    cur.data.layout = $('[name="layout"]').value;
    renderThumbs(); renderLayouts(); changed();
  });
  $('#upload').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const name = await upload(file);
    cur.data.image = './' + name;
    cur.data.layout = $('[name="layout"]').value;
    renderThumbs(); renderLayouts(); changed();
  });
  $('#shuffle').addEventListener('click', () => {
    const pool = cur.data.image ? [...META.image, ...META.type] : META.type;
    $('[name="layout"]').value = pool[Math.floor(Math.random() * pool.length)];
    renderLayouts();
    changed();
  });
  $('#tools').addEventListener('click', (e) => {
    const k = e.target.dataset.snip;
    if (k) insert(snippets()[k]);
  });
  const ta = $('textarea.body');
  ta.addEventListener('dragover', (e) => { e.preventDefault(); ta.classList.add('drop'); });
  ta.addEventListener('dragleave', () => ta.classList.remove('drop'));
  ta.addEventListener('drop', async (e) => {
    e.preventDefault(); ta.classList.remove('drop');
    for (const file of [...e.dataTransfer.files].filter((f) => f.type.startsWith('image/'))) {
      const name = await upload(file);
      insert(`![${name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ')}](./${name} "offset | ")`);
    }
  });
}

async function upload(file) {
  state('uploading…', 'dirty');
  const name = file.name.toLowerCase().replace(/[^a-z0-9._-]+/g, '-');
  const r = await api(`/api/upload?id=${cur.id}&name=${encodeURIComponent(name)}`, { method: 'PUT', body: file });
  cur.images = r.images;
  state('uploaded ' + r.name);
  return r.name;
}

function insert(text) {
  const ta = $('textarea.body');
  const [a, b] = [ta.selectionStart, ta.selectionEnd];
  const before = ta.value.slice(0, a);
  const after = ta.value.slice(b);
  const pad = before && !before.endsWith('\n\n') ? (before.endsWith('\n') ? '\n' : '\n\n') : '';
  // Blocks need a blank line on both sides, or Markdown runs them into the paragraph.
  const tail = !after || after.startsWith('\n\n') ? '\n' : after.startsWith('\n') ? '\n' : '\n\n';
  ta.setRangeText(pad + text + tail, a, b, 'end');
  ta.focus();
  changed();
}

function collect() {
  const main = $('#main');
  const v = (n) => main.querySelector(`[name="${n}"]`);
  const data = { ...cur.data };
  for (const k of ['title', 'date', 'tag', 'label', 'summary', 'layout', 'palette', 'image_alt']) data[k] = v(k).value.trim();
  data.cover = Object.fromEntries(Object.entries(cur.data.cover).filter(([, x]) => x.trim()));
  data.draft = v('draft').checked;
  if (!data.image) { delete data.image; delete data.image_alt; }
  return { data, body: v('body').value };
}

function changed() {
  state('unsaved', 'dirty');
  clearTimeout(timer);
  timer = setTimeout(save, 700);
}

async function save() {
  clearTimeout(timer); timer = null;
  if (home) return saveHome();
  if (!cur) return;
  const { data, body } = collect();
  try {
    await api('/api/post?id=' + cur.id, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data, body }) });
    cur.data = data;
    renderLayouts();
    state('saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    loadList();
    // Astro reports the rebuilt page (see 'reload' below); this catches a save it doesn't.
    clearTimeout(fallback);
    fallback = setTimeout(() => refresh(), 2500);
  } catch (e) {
    state('save failed: ' + e.message, 'err');
  }
}

async function saveHome() {
  try {
    await api('/api/home', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(homeData()) });
    state('saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    clearTimeout(fallback);
    fallback = setTimeout(() => refresh(), 2500);
  } catch (e) {
    state('save failed: ' + e.message, 'err');
  }
}

// ---- Preview ----
// The split frame loads the site through the desk (same origin), so a new render
// loads in a hidden frame behind the current one and swaps in at the same scroll
// position once it's ready. No blank page between saves.
const postPath = () => {
  if (!cur) return '/';
  if (!catalog) return `/log/${cur.id}/`;
  const q = new URLSearchParams({ tab: store.get('catTab', 'heroes'), layout: $('[name="layout"]').value || (cur.data.image ? cur.auto.image : cur.auto.none), palette: $('[name="palette"]').value });
  return `/desk/catalog/${cur.id}/?${q}`;
};
let fallback = null, pending = null;

function showPreview() {
  $('#pvurl').textContent = META.site + postPath();
  const mode = store.get('pv', 'split');
  if (mode === 'split') refresh();
  if (mode === 'popup' && popup && !popup.closed) popup.location = META.site + postPath();
}

function refresh() {
  clearTimeout(fallback);
  if (store.get('pv', 'split') !== 'split') return;
  const old = $('#frame');
  const path = postPath();
  pending?.remove();
  const next = document.createElement('iframe');
  next.title = 'Preview';
  next.className = 'next';
  pending = next;
  next.addEventListener('load', () => {
    if (pending !== next) return;
    pending = null;
    // Same page: keep the reader where they were.
    try {
      if (old.contentWindow.location.pathname === path) next.contentWindow.scrollTo(0, old.contentWindow.scrollY);
    } catch {}
    next.id = 'frame';
    next.className = '';
    old.remove();
  }, { once: true });
  next.src = path;
  old.after(next);
}

// Astro rebuilt the page after a save: swap in the new render.
window.addEventListener('message', (e) => {
  // Both frames hear it while one is loading; let the burst settle into one refresh.
  if (e.origin !== location.origin || e.data?.desk !== 'reload') return;
  clearTimeout(fallback);
  fallback = setTimeout(refresh, 100);
});

function setPreviewMode(mode) {
  store.set('pv', mode);
  document.querySelectorAll('[data-pv]').forEach((b) => b.classList.toggle('on', b.dataset.pv === mode));
  document.body.classList.toggle('pv-off', mode !== 'split');
  if (mode === 'popup') popup = window.open(META.site + postPath(), 'desk-preview', 'width=960,height=1000');
  showPreview();
}
function setWidth(w) {
  store.set('w', w);
  document.querySelectorAll('[data-w]').forEach((b) => b.classList.toggle('on', b.dataset.w === w));
  $('#preview').classList.toggle('phone', w === 'phone');
}
document.querySelectorAll('[data-pv]').forEach((b) => b.addEventListener('click', () => setPreviewMode(b.dataset.pv)));
document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => setWidth(b.dataset.w)));
$('#reload').addEventListener('click', () => refresh());
// ---- Catalog: every cover for the open post, and every block, in the preview ----
function setCatalog(on) {
  catalog = on && !!cur;
  $('#catalog').classList.toggle('on', catalog);
  $('#catalog').disabled = !cur;
}
$('#catalog').addEventListener('click', () => {
  setCatalog(!catalog);
  if (catalog && store.get('pv', 'split') === 'off') setPreviewMode('split');
  else showPreview();
});

window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || e.data?.desk !== 'catalog' || !cur) return;
  const { tab, pick, insert: md } = e.data;
  if (tab) store.set('catTab', tab);
  if (md) insert(md);
  if (pick) {
    $('[name="layout"]').value = pick.layout;
    if (pick.palette) $('[name="palette"]').value = pick.palette;
    renderLayouts();
    changed();
  }
});

// ---- Dialogs: new post, publish ----
function ask(title, html, okLabel = 'ok') {
  const dlg = $('#dlg');
  $('#dlgT').textContent = title;
  $('#dlgB').innerHTML = html;
  $('#dlgOk').textContent = okLabel;
  dlg.showModal();
  return new Promise((res) => dlg.addEventListener('close', () => res(dlg.returnValue === 'ok'), { once: true }));
}

$('#new').addEventListener('click', async () => {
  const ok = await ask('New post', `<div class="row"><label class="grow">title<input id="nTitle" autofocus /></label><label>tag<select id="nTag">${META.tags.map((t) => opt(t, t, 'build')).join('')}</select></label></div><p class="hint">Starts as a draft. Drafts show in the preview, never on the live site.</p>`, 'create');
  if (!ok) return;
  const title = $('#nTitle').value.trim();
  if (!title) return;
  const { id } = await api('/api/new', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title, tag: $('#nTag').value }) });
  await open(id);
});

$('#publish').addEventListener('click', async () => {
  if (timer) await save();
  const st = await api('/api/status');
  const draft = cur && $('[name="draft"]')?.checked;
  const what = home ? '<b>the home page</b>' : cur ? `<b>${esc(cur.data.title)}</b>` : 'all post changes';
  const ok = await ask('Publish', `<p>Commits ${what} and pushes branch <b>${esc(st.branch)}</b>. The live site redeploys when <b>main</b> changes.</p>${draft ? '<p class="hint">This post is still a draft, so it will not show on the site. Untick draft first to publish it.</p>' : ''}<pre>${esc(st.changes || 'No uncommitted post changes.')}</pre><label class="grow">commit message<input id="msg" value="${esc(home ? 'Home: update' : cur ? 'Post: ' + cur.data.title : 'Update posts')}" /></label>`, 'commit & push');
  if (!ok) return;
  state('publishing…', 'dirty');
  try {
    const r = await api('/api/publish', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: cur?.id, home: !!home, message: $('#msg').value }) });
    await ask('Published', `<pre>${esc(r.log)}</pre>`, 'ok');
    state('published');
  } catch (e) {
    state('publish failed', 'err');
    await ask('Publish failed', `<pre>${esc(e.message)}</pre>`);
  }
});

window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
});
window.addEventListener('beforeunload', () => { if (timer) save(); });

boot().catch((e) => state('could not start: ' + e.message, 'err'));
</script>
</body>
</html>
