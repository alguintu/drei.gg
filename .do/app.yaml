# DigitalOcean App Platform spec. Create the app with:
#   doctl apps create --spec .do/app.yaml
# Static sites are on App Platform's free tier.
name: drei-gg
region: sgp
static_sites:
  - name: site
    github:
      repo: alguintu/drei.gg
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    error_document: 404.html
    environment_slug: node-js
domains:
  - domain: drei.gg
    type: PRIMARY
    zone: drei.gg
  - domain: www.drei.gg
    type: ALIAS
    zone: drei.gg
